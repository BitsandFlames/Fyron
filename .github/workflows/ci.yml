name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/image-curator/backend/package-lock.json
            apps/image-curator/frontend/package-lock.json
      - run: npm ci && npm test
        working-directory: apps/image-curator/backend
      - run: npm ci && npm test && npm run build
        working-directory: apps/image-curator/frontend
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*
          if-no-files-found: error
  test:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - run: uv sync --all-extras --dev
      - run: uv run python -m compileall -q src/fyron
      - run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          FYRON_TEST_WHEEL="${wheels[0]}" uv run pytest
      - run: uv run python scripts/check_docstrings.py
      - run: uv run python scripts/build_docs.py
      - run: uv run python scripts/check_release_readiness.py --skip-git-clean
  wheel:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, extra: base, platform: ""}
          - {os: ubuntu-latest, extra: survival, platform: ""}
          - {os: ubuntu-latest, extra: survival-ml, platform: ""}
          - {os: ubuntu-latest, extra: ml, platform: ""}
          - {os: macos-latest, extra: base, platform: "--platform-tests"}
          - {os: windows-latest, extra: base, platform: "--platform-tests"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Isolated installed-wheel operations and examples
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/check_wheel.py --wheel "${wheels[0]}" --extra "${{ matrix.extra }}" ${{ matrix.platform }}
